<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="940" height="380" fill="#ffffff"/>
  <text x="470" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Serverless URL Shortener on AWS</text>

  <!-- Main boxes -->
  <rect x="20" y="120" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Browser</text>
  <text x="95" y="182" text-anchor="middle" font-size="12" fill="#475569">index.html</text>

  <rect x="270" y="120" width="150" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="345" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">API Gateway</text>
  <text x="345" y="182" text-anchor="middle" font-size="12" fill="#475569">HTTP API</text>

  <rect x="520" y="120" width="150" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="595" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Lambda</text>
  <text x="595" y="182" text-anchor="middle" font-size="12" fill="#475569">Python function</text>

  <rect x="770" y="120" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="845" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">DynamoDB</text>
  <text x="845" y="182" text-anchor="middle" font-size="12" fill="#475569">url-shortner table</text>

  <!-- Arrows between boxes -->
  <line x1="172" y1="165" x2="268" y2="165" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="220" y="138" text-anchor="middle" font-size="11" fill="#334155">POST /shorten</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#334155">GET /{code}</text>
  <text x="220" y="188" text-anchor="middle" font-size="11" fill="#334155">short URL / 302</text>

  <line x1="422" y1="165" x2="518" y2="165" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="470" y="152" text-anchor="middle" font-size="11" fill="#334155">invoke</text>
  <text x="470" y="188" text-anchor="middle" font-size="11" fill="#334155">response</text>

  <line x1="672" y1="165" x2="768" y2="165" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="720" y="138" text-anchor="middle" font-size="11" fill="#334155">PutItem</text>
  <text x="720" y="152" text-anchor="middle" font-size="11" fill="#334155">GetItem</text>
  <text x="720" y="188" text-anchor="middle" font-size="11" fill="#334155">item</text>

  <!-- Supporting services under Lambda -->
  <line x1="570" y1="212" x2="520" y2="278" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="620" y1="212" x2="670" y2="278" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="440" y="280" width="160" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">IAM role</text>
  <text x="520" y="326" text-anchor="middle" font-size="11" fill="#475569">least privilege, one table</text>

  <rect x="620" y="280" width="160" height="60" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CloudWatch Logs</text>
  <text x="700" y="326" text-anchor="middle" font-size="11" fill="#475569">function logs, debugging</text>
</svg>
